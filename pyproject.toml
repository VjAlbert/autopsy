[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "drdeconstruct"
version = "0.1.1"
description = "AI-assisted reverse engineering for everyone: decompiled code, firmware, serial logs, smart-home devices and websites, explained step by step."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "reverse-engineering", "firmware", "ghidra", "disassembly", "frontend", "smart-home",
    "claude", "ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
# Hardware acquisition: serial/UART, USB (libusb-package ships the libusb DLL), Bluetooth LE
hardware = ["pyserial>=3.5", "pyusb>=1.2", "libusb-package>=1.0.26", "bleak>=0.22"]
# Smart home: Xiaomi (miIO, MiBeacon), Aqara, Tapo (KLAP), mDNS discovery
smarthome = ["bleak>=0.22", "zeroconf>=0.132", "cryptography>=42"]
# Desktop GUI
gui = ["PySide6-Essentials>=6.6"]
# Optional engine via API key (off by default)
api = ["anthropic>=1.13"]
dev = ["pytest>=8", "ruff>=0.6"]
# Everything, for the Windows exe
full = ["drdeconstruct[hardware,smarthome,gui,api]"]

[project.urls]
Homepage = "https://github.com/VjAlbert/autopsy"
Repository = "https://github.com/VjAlbert/autopsy"
Issues = "https://github.com/VjAlbert/autopsy/issues"

[project.scripts]
drdec = "drdeconstruct.cli:main"

[project.gui-scripts]
drdec-gui = "drdeconstruct.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drdeconstruct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Dati SVG delle icone: righe lunghe per restare leggibili come disegno.
"src/drdeconstruct/gui/icons.py" = ["E501"]
