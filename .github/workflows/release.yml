name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[full]" pyinstaller
      - run: pyinstaller packaging/drdeconstruct.spec
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/DrDeconstruct.exe
          generate_release_notes: true
