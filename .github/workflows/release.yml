name: Release

# Pushing a tag like v0.2.0 builds the Windows installer and the portable exe and
# publishes them on the GitHub Releases page. "Run workflow" does the same from the
# browser: type a version (e.g. 0.2.0) and the tag v0.2.0 is created on the chosen
# branch; leave it empty for a test build (downloadable from the run's artifacts only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.0 (empty = test build, nothing published)"
        required: false
        default: ""

env:
  # The version of this build: from the tag, from the "Run workflow" box, or a test build.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Version number without the leading v
        if: env.VERSION != ''
        shell: pwsh
        run: |
          $v = "${{ env.VERSION }}".TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { Write-Error "Version must look like 0.2.0, got '$v'"; exit 1 }
          "VERSION_NUMBER=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[full]" pyinstaller
      - run: pyinstaller packaging/drdeconstruct.spec
      - name: Version box must match the code
        if: env.VERSION != ''
        shell: pwsh
        run: |
          $code = python -c "import drdeconstruct; print(drdeconstruct.__version__)"
          if ($code -ne $env:VERSION_NUMBER) { Write-Error "Version $env:VERSION_NUMBER does not match __version__ $code in src/drdeconstruct/__init__.py"; exit 1 }
      - name: Self-check the exe (libusb, serial, Bluetooth, Qt, data files)
        shell: pwsh
        run: |
          $p = Start-Process dist\DrDeconstruct.exe -ArgumentList "--self-check","selfcheck.txt" -Wait -PassThru
          Get-Content selfcheck.txt
          if ($p.ExitCode -ne 0) { Write-Error "Self-check failed with code $($p.ExitCode)"; exit 1 }
      - name: Smoke test the exe (starts and exits)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist\DrDeconstruct.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Error "DrDeconstruct.exe exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process $p
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: pwsh
        run: |
          $version = if ($env:VERSION) { $env:VERSION.TrimStart("v") } else { "0.0.0-test" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss
          Rename-Item dist\DrDeconstruct.exe DrDeconstruct-portable.exe
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            dist/DrDeconstruct-Setup-*.exe
            dist/DrDeconstruct-portable.exe
            dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: env.VERSION != ''
        with:
          # Creates the tag on the built commit when the release starts from "Run workflow".
          tag_name: v${{ env.VERSION_NUMBER }}
          target_commitish: ${{ github.sha }}
          name: DrDeconstruct ${{ env.VERSION_NUMBER }}
          make_latest: true
          files: |
            dist/DrDeconstruct-Setup-*.exe
            dist/DrDeconstruct-portable.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Download for Windows

            - **`DrDeconstruct-Setup-*.exe`**: the installer (recommended). Double-click, follow the wizard.
            - **`DrDeconstruct-portable.exe`**: a single file, no installation. Run it from anywhere.

            Windows SmartScreen may say "Windows protected your PC" because the app is not code-signed yet.
            Click **More info** then **Run anyway**. You can verify the download against `SHA256SUMS.txt`.
            See the [README](https://github.com/VjAlbert/autopsy#download-for-windows) for step-by-step screenshots-free instructions.
