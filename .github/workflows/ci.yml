name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Librerie di sistema per Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -e ".[dev,gui,smarthome]"
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check .
          ruff format --check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
